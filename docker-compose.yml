version: '3.8'

services:
  # FastAPI PostGIS & Hydrodynamic Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaldrishti-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=JALDRISHTI
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql+asyncpg://jaldrishti:jaldrishti_secure_pwd@postgres:5432/jaldrishti_gis
      - DATABASE_URL_SYNC=postgresql://jaldrishti:jaldrishti_secure_pwd@postgres:5432/jaldrishti_gis
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000"]
      - MUNICIPALITY_NAME=Barasat Municipality
      - MUNICIPALITY_CODE=BARASAT_WB
      - DEFAULT_LATITUDE=22.7214
      - DEFAULT_LONGITUDE=88.4821
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jaldrishti-network

  # PostgreSQL with PostGIS Spatial Database Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: jaldrishti-postgis
    restart: unless-stopped
    environment:
      - POSTGRES_USER=jaldrishti
      - POSTGRES_PASSWORD=jaldrishti_secure_pwd
      - POSTGRES_DB=jaldrishti_gis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaldrishti -d jaldrishti_gis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jaldrishti-network

  # Redis In-Memory Telemetry Cache & Pub/Sub Broker
  redis:
    image: redis:7.2-alpine
    container_name: jaldrishti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jaldrishti-network

  # Frontend Digital Twin UI & Command Center
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jaldrishti-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - jaldrishti-network

volumes:
  postgres_data:
  redis_data:

networks:
  jaldrishti-network:
    driver: bridge
